name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

# 连续 push 时只保留最新一次构建，避免浪费 Actions 额度
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Declare default permissions as read only.
permissions: read-all

jobs:
  build_apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Building relies on the Android Gradle plugin (9.3.1) + jvmToolchain 21,
      # which requires a modern Java version (not the default one).
      - name: Set up JDK for Android Gradle plugin
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-pub-gradle-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-gradle-

      # 使用项目内置的 Flutter wrapper（`./flutterw`），SDK 版本由 `.flutter` submodule
      # 的 gitlink 锁定，与 `pubspec.yaml` 的 `environment.flutter` 严格一致。
      #
      # 不要用 `subosito/flutter-action`：本项目依赖的 `3.47.0-0.3.pre` 属于 **beta** 频道，
      # 该 action 默认按 `stable` 解析版本号，会直接失败：
      #   Unable to determine Flutter version for channel: stable version: 3.47.0-0.3.pre
      - name: Get Flutter packages
        run: ./flutterw pub get

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      # `apply_flavor_play.sh` 负责切换 `aves_report_platform` / `aves_services_platform` 依赖；
      # productFlavors 为 play / izzy / libre 且无 default，必须显式指定 `--flavor` 与入口文件。
      - name: Build debug APK (play flavor)
        run: |
          scripts/apply_flavor_play.sh 2>&1 | tee -a build_log.txt
          ./flutterw build apk --debug -t lib/main_play.dart --flavor play 2>&1 | tee -a build_log.txt

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weitu-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload build log (diagnostics)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn
