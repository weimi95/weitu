<style>
  :root{

    --text-2:#6b7280;
    --text-3:#9ca3af;
    --border:#ecedef;
    --bg-2:#f7f8f9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    line-height:1.65;
    background:#fff;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 20px;}
  a{color:inherit;text-decoration:none;}

  /* nav */
  nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--border);}
  .brand{font-size:17px;font-weight:600;letter-spacing:1px;}
  .nav-link{color:var(--accent);font-size:14px;}

  /* hero */
  .hero{text-align:center;padding:72px 0 60px;}
  .hero h1{font-size:42px;font-weight:600;letter-spacing:3px;}
  .hero p{margin-top:16px;color:var(--text-2);font-size:16px;}
  .hero .cta{margin-top:32px;}
  .btn{
    display:inline-block;background:var(--accent);color:#fff;
    padding:12px 28px;border-radius:8px;font-size:15px;transition:opacity .15s;
  }
  .btn:hover{opacity:.9;}

  /* section title */
  .sec{padding:48px 0;border-top:1px solid var(--border);}
  .sec-title{font-size:20px;font-weight:600;margin-bottom:24px;text-align:center;}

  /* features */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{border:1px solid var(--border);border-radius:12px;padding:20px;}
  .card h3{font-size:16px;font-weight:600;margin-bottom:8px;}
  .card p{color:var(--text-2);font-size:14px;}

  /* screenshots */
  .shots{display:flex;gap:14px;flex-wrap:wrap;}
  .shot{flex:1;min-width:150px;}
  .shot img{width:100%;height:auto;display:block;border:1px solid var(--border);border-radius:10px;}

  /* download */
  .download{background:var(--bg-2);border-radius:14px;padding:40px 24px;text-align:center;}
  .download h2{font-size:20px;font-weight:600;}
  .download p{color:var(--text-2);font-size:14px;margin-top:10px;}
  .download .btn{margin-top:24px;}

  /* footer */
  footer{text-align:center;color:var(--text-3);font-size:13px;padding:28px 0;border-top:1px solid var(--border);}
  footer a{color:var(--text-2);margin:0 8px;}

  @media(max-width:560px){
    .hero h1{font-size:32px;}
    .grid{grid-template-columns:1fr;}
  }
</style>
