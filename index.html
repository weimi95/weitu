<style>
  :root{
    --accent:#0F6E56;
    --accent-2:#16a085;
    --accent-soft:#E1F5EE;
    --text:#1f2937;
    --text-2:#6b7280;
    --text-3:#9ca3af;
    --border:#ecedef;
    --bg-2:#f7f8f9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    line-height:1.65;
    background:#fff;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 20px;}
  a{color:inherit;text-decoration:none;}

  /* nav — frosted sticky */
  nav{
    position:sticky;top:0;z-index:20;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 0;
    border-bottom:1px solid transparent;
    background:rgba(255,255,255,.72);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    transition:border-color .25s, background .25s;
  }
  nav.scrolled{border-bottom:1px solid var(--border);background:rgba(255,255,255,.86);}
  .brand{font-size:17px;font-weight:600;letter-spacing:1px;}
  .nav-link{color:var(--accent);font-size:14px;}

  /* hero */
  .hero{position:relative;text-align:center;padding:80px 0 60px;overflow:hidden;}
  /* decorative glow blobs (parallax target) */
  .hero::before,.hero::after{
    content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;z-index:0;
    pointer-events:none;
  }
  .hero::before{width:340px;height:340px;background:radial-gradient(circle,#a7e8d0,transparent 70%);top:-120px;left:-80px;}
  .hero::after{width:300px;height:300px;background:radial-gradient(circle,#bfe3ff,transparent 70%);bottom:-120px;right:-60px;}
  .hero > *{position:relative;z-index:1;}
  .hero h1{
    font-size:42px;font-weight:600;letter-spacing:3px;
    background:linear-gradient(100deg,var(--accent) 0%,#16a085 25%,#2bd4a8 50%,#16a085 75%,var(--accent) 100%);
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 6s linear infinite;
  }
  @keyframes shimmer{to{background-position:200% center;}}
  .hero p{margin-top:16px;color:var(--text-2);font-size:16px;}
  .hero .cta{margin-top:32px;}
  .btn{
    display:inline-block;background:var(--accent);color:#fff;
    padding:12px 28px;border-radius:8px;font-size:15px;
    box-shadow:0 6px 18px rgba(15,110,86,.25);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,110,86,.32);}
  .btn:active{transform:translateY(0);}

  /* section title */
  .sec{padding:48px 0;border-top:1px solid var(--border);}
  .sec-title{font-size:20px;font-weight:600;margin-bottom:24px;text-align:center;}

  /* features */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;perspective:900px;}
  .card{
    border:1px solid var(--border);border-radius:12px;padding:20px;background:#fff;
    transform-style:preserve-3d;transition:transform .18s ease, box-shadow .25s ease, border-color .25s;
    will-change:transform;
  }
  .card h3{font-size:16px;font-weight:600;margin-bottom:8px;transform:translateZ(20px);}
  .card p{color:var(--text-2);font-size:14px;transform:translateZ(12px);}
  .card:hover{
    border-color:var(--accent-soft);
    box-shadow:0 14px 30px rgba(15,110,86,.16), 0 0 0 1px var(--accent-soft) inset;
  }

  /* screenshots */
  .shots{display:flex;gap:14px;flex-wrap:wrap;perspective:1000px;}
  .shot{flex:1;min-width:150px;transform-style:preserve-3d;transition:transform .18s ease, box-shadow .25s ease;will-change:transform;}
  .shot img{width:100%;height:auto;display:block;border:1px solid var(--border);border-radius:10px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);transition:box-shadow .25s;}
  .shot:hover img{box-shadow:0 16px 38px rgba(15,110,86,.18);}

  /* download */
  .download{background:var(--bg-2);border-radius:14px;padding:40px 24px;text-align:center;}
  .download h2{font-size:20px;font-weight:600;}
  .download p{color:var(--text-2);font-size:14px;margin-top:10px;}
  .download .btn{margin-top:24px;}

  /* footer */
  footer{text-align:center;color:var(--text-3);font-size:13px;padding:28px 0;border-top:1px solid var(--border);}
  footer a{color:var(--text-2);margin:0 8px;}

  /* scroll reveal */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease, transform .6s ease;}
  .reveal.in{opacity:1;transform:none;}

  @media(max-width:560px){
    .hero h1{font-size:32px;}
    .grid{grid-template-columns:1fr;}
  }

  /* respect reduced motion */
  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
    .reveal{opacity:1;transform:none;}
    html{scroll-behavior:auto;}
  }
</style>
</head>
<body>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var finePointer = window.matchMedia && window.matchMedia('(pointer:fine)').matches;

  // 1) sticky nav border on scroll
  var nav = document.getElementById('nav');
  var onScroll = function(){ nav.classList.toggle('scrolled', window.scrollY > 8); };
  window.addEventListener('scroll', onScroll, {passive:true}); onScroll();

  // 2) scroll reveal
  if (!reduce && 'IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, {threshold:0.12});
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); });
  }

  // 3) mouse parallax + 3D tilt (only desktop, no reduced motion)
  if (!reduce && finePointer){
    // Hero glow parallax
    var hero = document.querySelector('.hero');
    var rx=0, ry=0, tx=0, ty=0, raf=0;
    hero.addEventListener('mousemove', function(ev){
      var r = hero.getBoundingClientRect();
      rx = (ev.clientX - r.left)/r.width - .5;   // -0.5..0.5
      ry = (ev.clientY - r.top)/r.height - .5;
      if(!raf) raf = requestAnimationFrame(applyHero);
    });
    hero.addEventListener('mouseleave', function(){ rx=0; ry=0; if(!raf) raf=requestAnimationFrame(applyHero); });
    function applyHero(){
      raf=0; tx += (rx - tx)*0.12; ty += (ry - ty)*0.12;
      hero.style.transform = 'translate3d('+(tx*-14)+'px,'+(ty*-10)+'px,0)';
      if(Math.abs(rx-tx)>0.001 || Math.abs(ry-ty)>0.001){ raf=requestAnimationFrame(applyHero); }
    }

    // 3D tilt on cards & shots
    document.querySelectorAll('.tilt').forEach(function(el){
      var tr=0, tg=0, cr=0, cg=0, traf=0;
      el.addEventListener('mousemove', function(ev){
        var r = el.getBoundingClientRect();
        var px = (ev.clientX - r.left)/r.width - .5;
        var py = (ev.clientY - r.top)/r.height - .5;
        cr = py * -8;  // rotateX
        cg = px * 10;  // rotateY
        if(!traf) traf = requestAnimationFrame(applyTilt);
      });
      el.addEventListener('mouseleave', function(){
        cr=0; cg=0; if(!traf) traf=requestAnimationFrame(applyTilt);
      });
      function applyTilt(){
        traf=0;
        tr += (cr - tr)*0.2; tg += (cg - tg)*0.2;
        el.style.transform = 'perspective(900px) rotateX('+tr.toFixed(2)+'deg) rotateY('+tg.toFixed(2)+'deg)';
        if(Math.abs(cr-tr)>0.01 || Math.abs(cg-tg)>0.01){ traf=requestAnimationFrame(applyTilt); }
      }
    });
  }
})();
</script>
